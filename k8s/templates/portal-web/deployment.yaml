apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-portal-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-web
spec:
  replicas: {{ index .Values "portalWeb" "replicas" }}
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: portal-web
  template:
    metadata:
      labels:
        {{- include "forge.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal-web
    spec:
      containers:
        - name: portal-web
          image: {{ index .Values "portalWeb" "image" "repository" }}:{{ index .Values "portalWeb" "image" "tag" }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NUXT_PUBLIC_API_BASE
              value: {{ index .Values "portalWeb" "env" "apiBase" | quote }}
            - name: NUXT_PUBLIC_AI_CHAT_BASE
              value: {{ index .Values "portalWeb" "env" "aiChatBase" | quote }}
            - name: NUXT_PUBLIC_REGION
              value: {{ .Values.global.region | quote }}
            - name: NUXT_PUBLIC_DEFAULT_CURRENCY
              value: {{ .Values.global.defaultCurrency | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml index .Values "portalWeb" "resources" | nindent 12 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - portal-web
                topologyKey: kubernetes.io/hostname
