apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge.fullname" . }}-redis
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.redis.auth.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge.fullname" . }}-app
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@postgres:%v/%s" .Values.postgres.auth.username .Values.postgres.auth.password (int .Values.postgres.service.port) .Values.postgres.auth.database | b64enc | quote }}
  REDIS_URL: {{ printf "redis://:%s@redis:%v/0" .Values.redis.auth.password (int .Values.redis.service.port) | b64enc | quote }}
  JWT_SECRET_KEY: {{ .Values.backend.env.jwtSecretKey | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.auth.rootUser | b64enc | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.auth.rootPassword | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.backend.env.openaiApiKey | b64enc | quote }}
