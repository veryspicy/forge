{{- if .Values.ingress.enabled }}
{{- if eq .Values.ingress.className "traefik" }}
---
# Traefik IngressRoute (K3s built-in Traefik v3)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "forge.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.ingress.hosts[0].host }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{ include "forge.fullname" . }}-backend
          port: 8000
    - match: Host(`{{ .Values.ingress.hosts[0].host }}`) && PathPrefix(`/ai`)
      kind: Rule
      services:
        - name: {{ include "forge.fullname" . }}-ai-service
          port: 8001
    - match: Host(`{{ .Values.ingress.hosts[0].host }}`)
      kind: Rule
      services:
        - name: {{ include "forge.fullname" . }}-frontend
          port: 3000
{{- else }}
---
# Standard Kubernetes Ingress (fallback for non-Traefik ingress controllers)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "forge.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "forge.fullname" $ }}-{{ .service }}
                port:
                  number:
                    {{- if eq .service "frontend" }}
                    3000
                    {{- else if eq .service "backend" }}
                    8000
                    {{- else if eq .service "ai-service" }}
                    8001
                    {{- end }}
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
