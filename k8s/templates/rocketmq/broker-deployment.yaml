apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-rocketmq-broker
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: rocketmq-broker
spec:
  replicas: {{ .Values.rocketmq.broker.replicas }}
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rocketmq-broker
  template:
    metadata:
      labels:
        {{- include "forge.labels" . | nindent 8 }}
        app.kubernetes.io/component: rocketmq-broker
    spec:
      initContainers:
        - name: wait-for-namesrv
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RocketMQ Name Server..."
              until nc -z {{ include "forge.fullname" . }}-rocketmq-namesrv {{ .Values.rocketmq.namesrv.service.port }}; do
                echo "Name Server not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Name Server is ready!"
      containers:
        - name: broker
          image: {{ .Values.rocketmq.broker.image.repository }}:{{ .Values.rocketmq.broker.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - mqbroker
            - --enable-proxy
          ports:
            - name: remoting
              containerPort: 10911
              protocol: TCP
            - name: grpc
              containerPort: 10912
              protocol: TCP
            - name: proxy
              containerPort: 8081
              protocol: TCP
          env:
            - name: NAMESRV_ADDR
              value: {{ include "forge.fullname" . }}-rocketmq-namesrv:{{ .Values.rocketmq.namesrv.service.port }}
          resources:
            {{- toYaml .Values.rocketmq.broker.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 30
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "forge.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: rocketmq-broker
                topologyKey: kubernetes.io/hostname
