apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge.fullname" . }}-ai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
spec:
  type: ClusterIP
  selector:
    {{- include "forge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
  ports:
    - name: http
      port: {{ .Values.aiService.service.port }}
      targetPort: 8001
      protocol: TCP
