server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    resolver 10.89.1.1 valid=30s;

    # k8s 探活端点（readiness/liveness；compose 形态不影响）
    location = /healthz {
        return 200;
    }

    # SPA fallback — all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must be revalidated on every load, otherwise browsers
        # may serve a stale cached copy after admin image rebuilds
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy /api to backend (^~ prevents regex location from intercepting)
    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /images to backend (served by FastAPI StaticFiles)
    location ^~ /images {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
