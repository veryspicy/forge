packages:
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: false
  vue-demi: false
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
overrides:
  form-data: 4.0.6
  postcss@^8: 8.5.18
  nanoid@^3: 3.3.18
  nanoid@^5: 5.1.16
  brace-expansion@^5: 5.0.9
