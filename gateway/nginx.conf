# gateway/nginx.conf — Forge 统一反向代理网关（compose 中间件形态）
# 路由语义与 k8s Ingress 一致：/admin/ → admin(strip)、/ → portal-web、/api 等 → backend
# 所有 upstream 均用 resolver + 变量动态解析：容器重建更换 IP 后无需重启/reload 网关。
# 注意：proxy_pass 含变量时不自动 strip 前缀，需 strip 的 location 用 rewrite 显式剥离。
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # podman DNS（docker_forge 网络内 nameserver），换环境需同步修改
    resolver 10.89.0.1 valid=30s ipv6=off;

    # ===== C 端 portal-web（根路径，商城首页）=====
    # 覆盖 /、/zh /en /ar 语言路由、/_nuxt /_ipx /favicon.ico 等所有 Nuxt 资源
    location / {
        set $portal_upstream http://portal-web:3000;
        proxy_pass $portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nuxt dev HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ===== Admin 后台（/admin/ 子路径，strip 前缀）=====
    # /admin/xxx → admin:80/xxx（admin 容器内以 / 为根，SPA fallback 不受影响）
    # 变量 proxy_pass 不自动 strip 前缀，rewrite 显式剥离（踩坑点，勿删）
    location /admin/ {
        set $admin_upstream http://admin:80;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 后端 API（Admin 与 C 端共用，同源绝对路径）=====
    location ^~ /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 后端静态/上传资源 =====
    location ^~ /images {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /uploads {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /minio {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===== AI 服务（可选，AI 聊天同域化）=====
    location /ai/ {
        set $ai_upstream http://ai-service:8001;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
