name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]

env:
  HARBOR_SERVER: harbor.forge.com
  HARBOR_PROJECT: forge
  REGISTRY_USERNAME: ${{ secrets.HARBOR_USER }}
  REGISTRY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

jobs:
  # 变更检测：按目录决定哪些 job 需要运行，避免每次合并全量跑
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'portal-web/**'
              - '.github/workflows/ci-cd.yml'
            admin:
              - 'admin/**'
              - '.github/workflows/ci-cd.yml'

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: |
          cd backend
          # dev 工具链（ruff/mypy/pytest/pip-audit）在 optional-dependencies.dev，需 --all-extras
          uv sync --frozen --all-extras
      
      - name: Run linter
        run: |
          cd backend
          uv run ruff check src/
      
      - name: Run type check
        run: |
          cd backend
          uv run mypy src/
      
      - name: Run tests
        run: |
          cd backend
          # 覆盖率 gate：当前 50% 起步，验证通过后逐步上调至 70%（见 DEV-RULES §15）
          uv run pytest tests/ -v --cov=src/forge --cov-report=xml --cov-fail-under=50
      
      - name: Run dependency audit
        run: |
          cd backend
          # ecdsa 的 Minerva 时序攻击（PYSEC-2026-1325 / CVE-2024-23342）影响全部版本且上游无修复计划，
          # python-jose 间接依赖，仅签名侧信道风险；待 python-jose 迁移后移除忽略。
          uv run pip-audit --ignore-vuln PYSEC-2026-1325
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # portal-web packageManager=pnpm@11.21.0 要求 Node >= 22.13
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: portal-web/pnpm-lock.yaml
      
      - name: Install dependencies
        run: cd portal-web && pnpm install --frozen-lockfile
      
      - name: Run linter
        run: cd portal-web && pnpm lint
      
      - name: Run tests
        run: cd portal-web && pnpm test
      
      - name: Type check
        run: cd portal-web && pnpm typecheck
      
      - name: Build
        # dev 合并不部署，构建留给 main/tag 的 build-images job
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: cd portal-web && pnpm build
      
      - name: Run dependency audit
        # .npmrc 指向 npmmirror（无 audit 端点），audit 临时切官方 registry
        run: cd portal-web && pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

  test-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: admin/pnpm-lock.yaml
      
      - name: Install dependencies
        run: cd admin && pnpm install --frozen-lockfile
      
      - name: Run linter
        run: cd admin && pnpm lint
      
      - name: Type check
        run: cd admin && pnpm typecheck
      
      - name: Build
        # dev 合并不部署，构建留给 main/tag 的 build-images job
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: cd admin && pnpm build
      
      - name: Run dependency audit
        # .npmrc 指向 npmmirror（无 audit 端点），audit 临时切官方 registry
        run: cd admin && pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Secret scanning (gitleaks)
        run: |
          # 固定版本资产名（latest/download 的 gitleaks_Linux_x86_64 旧命名已失效）
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  build-images:
    needs: [test-backend, test-frontend, test-admin, security-scan]
    runs-on: ubuntu-latest
    # main push（日常）或 v* tag push（正式发布，语义化版本见 DEV-RULES §15）
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Resolve image tag
        id: img
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Login to Harbor
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_SERVER }} -u ${{ env.REGISTRY_USERNAME }} --password-stdin
      
      - name: Build Backend
        run: |
          docker build -t ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.img.outputs.tag }} backend/
          docker push ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.img.outputs.tag }}
      
      - name: Build Frontend
        run: |
          docker build -t ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/portal-web:${{ steps.img.outputs.tag }} portal-web/
          docker push ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/portal-web:${{ steps.img.outputs.tag }}
      
      - name: Build AI Service
        run: |
          docker build -t ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/ai-service:${{ steps.img.outputs.tag }} ai-service/
          docker push ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/ai-service:${{ steps.img.outputs.tag }}
      
      - name: Build Admin
        run: |
          docker build -t ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/admin:${{ steps.img.outputs.tag }} admin/
          docker push ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/admin:${{ steps.img.outputs.tag }}
      
      - name: Image vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.img.outputs.tag }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table

  deploy-na:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to US-West K3s
        run: |
          # 配置 kubectl
          scp -o StrictHostKeyChecking=no ${{ secrets.K3S_NA_CONFIG }} ~/.kube/config
          
          # 更新镜像
          IMAGE_TAG=${{ github.sha }}
          kubectl set image deployment/portal-web portal-web=${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/portal-web:$IMAGE_TAG -n forge-public
          kubectl set image deployment/backend backend=${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/backend:$IMAGE_TAG -n forge-public
          kubectl set image deployment/ai-service ai-service=${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/ai-service:$IMAGE_TAG -n forge-public
          
          # 等待部署完成
          kubectl rollout status deployment/portal-web -n forge-public --timeout=300s
          kubectl rollout status deployment/backend -n forge-public --timeout=300s
          kubectl rollout status deployment/ai-service -n forge-public --timeout=300s

  deploy-eu:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to EU-West K3s
        run: |
          scp -o StrictHostKeyChecking=no ${{ secrets.K3S_EU_CONFIG }} ~/.kube/config
          
          IMAGE_TAG=${{ github.sha }}
          kubectl --context=k3s-eu set image deployment/portal-web portal-web=${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/portal-web:$IMAGE_TAG -n forge-public
          kubectl --context=k3s-eu set image deployment/backend backend=${{ env.HARBOR_SERVER }}/${{ env.HARBOR_PROJECT }}/backend:$IMAGE_TAG -n forge-public
          
          kubectl --context=k3s-eu rollout status deployment/portal-web -n forge-public --timeout=300s
          kubectl --context=k3s-eu rollout status deployment/backend -n forge-public --timeout=300s
